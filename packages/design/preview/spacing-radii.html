<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface); }
  .wrap { padding: 22px 24px; }
  .row { display: flex; gap: 16px; align-items: flex-end; }
  .sw { flex: 1; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .box { width: 100%; height: 56px; background: var(--brand-red-tint); border: 1.5px solid var(--brand-red); }
  .nm { font-weight: 800; font-size: 12px; color: var(--ink-1); }
  .sub { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }
</style>
</head>
<body>
<div class="wrap">
  <div class="row">
    <div class="sw"><div class="box" style="border-radius:var(--r-button)"></div><div class="nm">Button</div><div class="sub">12px</div></div>
    <div class="sw"><div class="box" style="border-radius:var(--r-chip)"></div><div class="nm">Chip / Card</div><div class="sub">16px</div></div>
    <div class="sw"><div class="box" style="border-radius:var(--r-pill)"></div><div class="nm">Pill</div><div class="sub">22px</div></div>
    <div class="sw"><div class="box" style="border-radius:var(--r-sheet)"></div><div class="nm">Holo</div><div class="sub">10px</div></div>
    <div class="sw"><div class="box" style="border-radius:var(--r-round);height:56px;width:56px;flex:none"></div><div class="nm">Round</div><div class="sub">full</div></div>
  </div>
</div>
</body>
</html>
