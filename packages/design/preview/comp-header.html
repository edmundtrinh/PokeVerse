<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--bg-app); }
  .header { display: flex; align-items: center; gap: 14px; background: var(--brand-red); color: #fff;
    padding: 14px 16px; box-shadow: var(--shadow-button); }
  .ic { font-size: 21px; }
  .title { flex: 1; font-family: var(--font-display); font-weight: 800; font-size: 18px; }
  .right { min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; }
  .note { padding: 14px 16px; font-size: 12px; color: var(--ink-3); }
</style>
</head>
<body>
<div class="header">
  <i class="ic fa-solid fa-bars"></i>
  <div class="title">PokéVerse · Pokédex</div>
  <div class="right"><i class="ic fa-solid fa-compact-disc"></i></div>
</div>
<div class="note">Fixed red header — hamburger (drawer) · contextual title · right action (TM-disk = sprite settings). White tint, bold title, ≥44px hit targets.</div>
</body>
</html>
