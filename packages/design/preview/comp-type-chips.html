<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface); }
  .wrap { padding: 22px 24px; display: flex; flex-direction: column; gap: 16px; }
  .rail { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { padding: 8px 16px; border-radius: var(--r-chip); color: #fff; font-weight: 700; font-size: 14px;
    border: 2px solid transparent; opacity: .7; text-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .chip.sel { opacity: 1; border-color: #fff; box-shadow: var(--shadow-button); }
  .lab { font-size: 11px; color: var(--ink-4); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <div class="lab">Type chips — selected gets full opacity + white ring</div>
  <div class="rail">
    <span class="chip sel" style="background:var(--type-fire)">Fire</span>
    <span class="chip" style="background:var(--type-water)">Water</span>
    <span class="chip sel" style="background:var(--type-grass)">Grass</span>
    <span class="chip" style="background:var(--type-electric)">Electric</span>
    <span class="chip" style="background:var(--type-psychic)">Psychic</span>
    <span class="chip" style="background:var(--type-dragon)">Dragon</span>
    <span class="chip" style="background:var(--type-fairy)">Fairy</span>
  </div>
</div>
</body>
</html>
