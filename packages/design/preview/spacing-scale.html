<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface); }
  .wrap { padding: 24px; }
  .scale { display: flex; flex-direction: column; gap: 10px; }
  .unit { display: flex; align-items: center; gap: 14px; }
  .bar { height: 16px; background: var(--brand-red); border-radius: 4px; }
  .nm { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); width: 96px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="scale">
    <div class="unit"><div class="nm">sp-1 · 4</div><div class="bar" style="width:4px"></div></div>
    <div class="unit"><div class="nm">sp-2 · 8</div><div class="bar" style="width:8px"></div></div>
    <div class="unit"><div class="nm">sp-3 · 12</div><div class="bar" style="width:12px"></div></div>
    <div class="unit"><div class="nm">sp-4 · 16</div><div class="bar" style="width:16px"></div></div>
    <div class="unit"><div class="nm">sp-5 · 20</div><div class="bar" style="width:20px"></div></div>
    <div class="unit"><div class="nm">sp-6 · 24</div><div class="bar" style="width:24px"></div></div>
    <div class="unit"><div class="nm">sp-8 · 32</div><div class="bar" style="width:32px"></div></div>
    <div class="unit"><div class="nm">sp-10 · 40</div><div class="bar" style="width:40px"></div></div>
  </div>
</div>
</body>
</html>
