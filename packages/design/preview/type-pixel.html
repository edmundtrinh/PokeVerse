<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--bg-app); }
  .wrap { padding: 26px 24px; display: flex; align-items: center; gap: 30px; }
  .pixel { font-family: var(--font-pixel); color: var(--ink-1); line-height: 1.5; }
  .big { font-size: 22px; }
  .dex { font-family: var(--font-pixel); color: var(--ink-4); font-size: 16px; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--ink-4); margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="col">
    <div class="pixel big">PIKACHU</div>
    <div class="dex">#0025 &nbsp; #0001 &nbsp; #1025</div>
    <div class="meta">Press Start 2P — retro pixel headings + Pokédex numerals</div>
  </div>
</div>
</body>
</html>
