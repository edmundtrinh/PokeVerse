<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--ink-1); }
  .wrap { padding: 24px; }
  .h1 { font-family: var(--font-display); font-weight: 500; font-size: 34px; color: #fff; line-height: 1.05; }
  .h1 .cursor { color: var(--type-grass); }
  .h2 { font-family: var(--font-display); font-weight: 400; font-size: 24px; color: var(--type-electric); margin-top: 8px; }
  .h3 { font-family: var(--font-display); font-weight: 400; font-size: 19px; color: var(--ink-4); margin-top: 8px; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--type-grass); margin-top: 16px; }
  .meta::before { content: "> "; }
</style>
</head>
<body>
<div class="wrap">
  <div class="h1">CATCH &apos;EM ALL<span class="cursor">_</span></div>
  <div class="h2">BUILD CUSTOM BINDERS</div>
  <div class="h3">Interactive Pokédex</div>
  <div class="meta">Pixelify Sans · 500 / 400 — blocky terminal display, lightened</div>
</div>
</body>
</html>
