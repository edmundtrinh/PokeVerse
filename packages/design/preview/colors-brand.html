<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface); }
  .wrap { padding: 22px 24px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .chip { height: 64px; border-radius: 12px; box-shadow: var(--shadow-button); }
  .nm { font-weight: 800; font-size: 13px; color: var(--ink-1); }
  .hex { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
</style>
</head>
<body>
<div class="wrap">
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--brand-red)"></div><div class="nm">Pokédex Red</div><div class="hex">#f44336</div></div>
    <div class="sw"><div class="chip" style="background:var(--brand-red-press)"></div><div class="nm">Red · Pressed</div><div class="hex">#d32f2f</div></div>
    <div class="sw"><div class="chip" style="background:var(--brand-red-dark)"></div><div class="nm">Red · Dark</div><div class="hex">#b71c1c</div></div>
    <div class="sw"><div class="chip" style="background:var(--brand-red-tint);border:1px solid var(--border)"></div><div class="nm">Red · Tint</div><div class="hex">#fdecea</div></div>
    <div class="sw"><div class="chip" style="background:var(--heart)"></div><div class="nm">Heart</div><div class="hex">#ef4444</div></div>
  </div>
</div>
</body>
</html>
