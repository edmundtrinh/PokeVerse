<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface); }
  .wrap { padding: 22px 24px; }
  .row { display: flex; gap: 12px; }
  .sw { flex: 1; display: flex; flex-direction: column; gap: 7px; }
  .chip { height: 58px; border-radius: 10px; border: 1px solid var(--border); }
  .nm { font-weight: 700; font-size: 12px; color: var(--ink-1); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }
  .ink .chip { border: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="row" style="margin-bottom:16px">
    <div class="sw"><div class="chip" style="background:var(--bg-app)"></div><div class="nm">App BG</div><div class="hex">#f9fafb</div></div>
    <div class="sw"><div class="chip" style="background:var(--bg-muted)"></div><div class="nm">Muted</div><div class="hex">#f5f5f5</div></div>
    <div class="sw"><div class="chip" style="background:var(--surface)"></div><div class="nm">Surface</div><div class="hex">#ffffff</div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-2)"></div><div class="nm">Inset</div><div class="hex">#f3f4f6</div></div>
    <div class="sw"><div class="chip" style="background:var(--border-strong)"></div><div class="nm">Border</div><div class="hex">#d1d5db</div></div>
  </div>
  <div class="row ink">
    <div class="sw"><div class="chip" style="background:var(--ink-1)"></div><div class="nm">Ink 1</div><div class="hex">#1f2937</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-2)"></div><div class="nm">Ink 2</div><div class="hex">#374151</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-3)"></div><div class="nm">Ink 3</div><div class="hex">#6b7280</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-4)"></div><div class="nm">Ink 4</div><div class="hex">#9ca3af</div></div>
    <div class="sw"><div class="chip" style="background:var(--success)"></div><div class="nm">Success</div><div class="hex">#4caf50</div></div>
  </div>
</div>
</body>
</html>
