<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface); }
  .wrap { padding: 20px 22px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw { display: flex; flex-direction: column; gap: 5px; }
  .chip { height: 44px; border-radius: 9px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 11px; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
  .nm { font-size: 10px; color: var(--ink-3); font-family: var(--font-mono); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="grid">
    <div class="sw"><div class="chip" style="background:var(--type-normal)">Normal</div><div class="nm">A8A878</div></div>
    <div class="sw"><div class="chip" style="background:var(--type-fire)">Fire</div><div class="nm">F08030</div></div>
    <div class="sw"><div class="chip" style="background:var(--type-water)">Water</div><div class="nm">6890F0</div></div>
    <div class="sw"><div class="chip" style="background:var(--type-electric)">Electric</div><div class="nm">F8D030</div></div>
    <div class="sw"><div class="chip" style="background:var(--type-grass)">Grass</div><div class="nm">78C850</div></div>
    <div class="sw"><div class="chip" style="background:var(--type-ice)">Ice</div><div class="nm">98D8D8</div></div>
    <div class="sw"><div class="chip" style="background:var(--type-fighting)">Fight</div><div class="nm">C03028</div></div>
    <div class="sw"><div class="chip" style="background:var(--type-poison)">Poison</div><div class="nm">A040A0</div></div>
    <div class="sw"><div class="chip" style="background:var(--type-ground)">Ground</div><div class="nm">E0C068</div></div>
    <div class="sw"><div class="chip" style="background:var(--type-flying)">Flying</div><div class="nm">A890F0</div></div>
    <div class="sw"><div class="chip" style="background:var(--type-psychic)">Psychic</div><div class="nm">F85888</div></div>
    <div class="sw"><div class="chip" style="background:var(--type-bug)">Bug</div><div class="nm">A8B820</div></div>
    <div class="sw"><div class="chip" style="background:var(--type-rock)">Rock</div><div class="nm">B8A038</div></div>
    <div class="sw"><div class="chip" style="background:var(--type-ghost)">Ghost</div><div class="nm">705898</div></div>
    <div class="sw"><div class="chip" style="background:var(--type-dragon)">Dragon</div><div class="nm">7038F8</div></div>
    <div class="sw"><div class="chip" style="background:var(--type-dark)">Dark</div><div class="nm">705848</div></div>
    <div class="sw"><div class="chip" style="background:var(--type-steel)">Steel</div><div class="nm">B8B8D0</div></div>
    <div class="sw"><div class="chip" style="background:var(--type-fairy)">Fairy</div><div class="nm">EE99AC</div></div>
  </div>
</div>
</body>
</html>
