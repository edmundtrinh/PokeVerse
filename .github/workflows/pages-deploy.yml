name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Web Export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check web dependencies
        id: web-deps
        run: |
          if ! node -e "require.resolve('react-native-web')" 2>/dev/null || \
             ! node -e "require.resolve('@expo/webpack-config')" 2>/dev/null; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing react-native-web or @expo/webpack-config — install them to enable web export"
          fi

      - name: Export for web
        if: steps.web-deps.outputs.missing != 'true'
        run: npx expo export:web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
