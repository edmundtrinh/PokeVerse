name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Web Export
    runs-on: ubuntu-latest
    outputs:
      exported: ${{ steps.export.outcome == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export for web
        id: export
        env:
          PUBLIC_URL: /PokeVerse/
        run: npx expo export:web

      - name: Upload Pages artifact
        if: steps.export.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-build

  deploy:
    name: Deploy
    needs: build
    if: needs.build.outputs.exported == 'true'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
